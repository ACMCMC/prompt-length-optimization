# Configuration for smoke test - minimal settings for quick validation
model: EleutherAI/pythia-70m
seed: 2262

# Dataset split ratios (must sum to 1.0)
dataset:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

train:
  # Dataset parameters - SMOKE TEST: minimal settings
  max_prompts: 25                      # Only 25 prompts for smoke test
  min_prompt_length: 30               # Minimum prompt length (characters)
  max_prompt_length: 150              # Maximum prompt length (characters)
  
  # Training parameters per prompt - SMOKE TEST: minimal settings
  episodes_per_prompt: 30              # Only 30 episode for smoke test
  steps_per_episode: 25               # Reduced steps for quick test
  init_len: 32                        # Initial prompt length in tokens (number of suffix positions with attention mask = 1 at start)
  max_suffix_len: 64                  # Maximum suffix length (fixed size for batched suffix embeddings)
  
  # Optimization parameters
  lr_embeddings: 0.01
  lr_policy: 0.0003
  epsilon: 0.3                        # Epsilon for epsilon-greedy exploration
  epsilon_decay: 0.998                # Epsilon decay per episode
  epsilon_min: 0.05                   # Minimum epsilon value
  entropy_coef: 0.05                  # Entropy bonus coefficient
  temperature: 1.5                    # Softmax temperature
  alpha: 1.0                          # Likelihood weight
  beta: 5.0                           # Length penalty (logarithmic: log(1+length), higher = more compression)
  reward_mode: terminal               # 'terminal' for final return, 'immediate' for per-step rewards
  save_policy_every_episode: false    # Save policy checkpoints after each outer episode
  projection_weight: 0.1              # Weight for projection regularization (continuous_proj mode)
  distance_metric: l2                 # Distance metric for projection: 'l2' or 'dot'
  
  # Parallel processing parameters - SMOKE TEST: batch size 1
  batch_size: 10                       # Batch size 10 for smoke test
  rollouts_per_prompt: 4               # Number of trajectories (rollouts) per prompt for GRPO
  
  # Output
  save_path: models/trained_policy_smoke_test.pt
  plots_prefix: smoke_test
  no_plots: false
  plots_format: pdf                   # png|pdf (default: pdf)
  
  # Wandb logging
  use_wandb: false                    # Disable wandb for smoke test
  wandb_project: prompt-optimization  # Wandb project name (not used if use_wandb is false)

  optimization_mode: continuous_proj  # Use continuous_proj optimizer for smoke test
  
  # GCG (Greedy Coordinate Gradient) parameters for discrete optimization
  gcg:
    top_k: 32
    batch_size: 64
    steps: 10
  
  # GRPO parameters (Group Relative Policy Optimization)
  grpo:
    epochs: 4                         # Number of GRPO update epochs per episode
    clip: 0.2                         # GRPO clipping epsilon
    gamma: 0.99                       # Discount factor
    entropy_coef: 0.01                # Entropy bonus coefficient (overrides train.entropy_coef if set)
    max_grad_norm: 0.5                # Maximum gradient norm for clipping
  
  # Policy network architecture
  policy:
    hidden_size: 64                  # Hidden layer size for policy network

eval:
  # Test dataset parameters
  max_test_prompts: 200               # Number of test prompts
  min_prompt_length: 30              # Min test prompt length
  max_prompt_length: 150              # Max test prompt length
  
  # Evaluation parameters
  init_len: 32                       # Initial prompt length (number of suffix positions with attention mask = 1 at start)
  max_suffix_len: 64                  # Maximum suffix length (fixed size for batched suffix embeddings)
  max_policy_steps: 150               # Max policy steps per prompt
  opt_steps: 15                      # Optimization steps (fewer for dataset eval)
  log_every_opt: 1                   # Reduce logging
  
  # Output
  results_file: results/eval_results.csv
  save_trace: true                   # Save individual traces
  trace_path: results/eval_trace.csv
  no_plots: false                    # Create plots
  plots_prefix: eval
  plots_format: pdf                  # png|pdf (for when plots are enabled)
  batch_size: 8                      # Batch size for evaluation
  dataset: toxicchat                # Dataset to use during evaluation
