# Configuration for toxic-chat dataset training and evaluation
model: EleutherAI/pythia-70m
seed: 2262

# Dataset split ratios (must sum to 1.0)
dataset:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

train:
  # Dataset parameters
  max_prompts: 200                   # Number of prompts to train on
  min_prompt_length: 30              # Minimum prompt length (characters)
  max_prompt_length: 150             # Maximum prompt length (characters)
  
  # Training parameters per prompt
  episodes_per_prompt: 5             # Episodes to train on each prompt
  steps_per_episode: 10             # Steps per episode (increased for better RL learning)
  init_len: 32                      # Initial prompt length in tokens
  
  # Optimization parameters
  lr_embeddings: 0.01
  lr_policy: 0.0003
  embedding_opt_steps: 5             # Gradient steps on embeddings before each policy move
  top_k_tokens: 5                    # Number of top next-token candidates considered for focused add
  policy_max_prompt_len: 64          # Max tokens the policy may expand to (None = adaptive default)
  alpha: 1.0                         # Likelihood weight
  beta: 0.2                          # Length penalty (higher = more compression)
  log_every: 5                       # Log policy progress every N steps (0 = silent)
  
  # Parallel processing parameters
  batch_size: 8                      # Prompts per batch for parallel processing
  num_workers: 4                     # Number of parallel worker processes
  
  # Output
  save_path: models/trained_policy.pt
  plots_prefix: training
  no_plots: false
  plots_format: pdf                  # png|pdf (default: pdf)

eval:
  # Test dataset parameters
  max_test_prompts: 20               # Number of test prompts
  min_prompt_length: 30              # Min test prompt length
  max_prompt_length: 150             # Max test prompt length
  
  # Evaluation parameters
  init_len: 32                       # Initial prompt length
  max_policy_steps: 30               # Max policy steps per prompt
  embedding_opt_steps: 5             # Inner embedding steps during evaluation
  top_k_tokens: 5                    # Top-K tokens considered for focused additions
  policy_max_prompt_len: 64          # Max prompt length the policy may consider during eval
  opt_steps: 15                      # Optimization steps (fewer for dataset eval)
  log_every_opt: 999                 # Reduce logging
  
  # Output
  results_file: results/eval_results.csv
  save_trace: true                  # Don't save individual traces
  trace_path: results/eval_trace.csv
  no_plots: false                     # Don't create individual plots
  plots_prefix: eval
  plots_format: pdf                  # png|pdf (for when plots are enabled)
