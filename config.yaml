# Unified configuration for training and evaluation
model: EleutherAI/pythia-70m
seed: 2262

train:
  target: "Santiago de Compostela is the capital of northwest Spain’s Galicia region. It’s known as the culmination of the Camino de Santiago pilgrimage route, and the alleged burial site of the Biblical apostle St. James. His remains reputedly lie within the Catedral de Santiago de Compostela, consecrated in 1211, whose elaborately carved stone facades open onto grand plazas within the medieval walls of the old town."
  episodes: 25
  steps_per_episode: 100
  init_len: 32
  lr_embeddings: 0.01
  lr_policy: 0.0003
  alpha: 1.0
  beta: 0.1
  log_every: 1
  save_path: models/trained_policy.yaml_run.pt
  plots_prefix: training
  no_plots: false

eval:
# test_prompt: "Santiago de Compostela is the capital of northwest Spain’s Galicia region. It’s known as the culmination of the Camino de Santiago pilgrimage route, and the alleged burial site of the Biblical apostle St. James. His remains reputedly lie within the Catedral de Santiago de Compostela, consecrated in 1211, whose elaborately carved stone facades open onto grand plazas within the medieval walls of the old town."
  test_prompt: "Madrid, Spain's central capital, is a city of elegant boulevards and expansive, manicured parks such as the Buen Retiro. It’s renowned for its rich repositories of European art, including the Prado Museum’s works by Goya, Velázquez and other Spanish masters. The heart of old Hapsburg Madrid is the portico-lined Plaza Mayor, and nearby is the baroque Royal Palace and Armory, displaying historic weaponry."
  init_len: 32
  max_policy_steps: 100
  opt_steps: 100
  log_every_opt: 1
  save_trace: true
  trace_path: results/eval_trace.yaml_run.csv
  no_plots: false
  plots_prefix: eval