# Configuration for toxic-chat dataset training and evaluation
model: EleutherAI/pythia-70m
seed: 2262

# Dataset split ratios (must sum to 1.0)
dataset:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

train:
  wandb:
    enable: true
    project: prompt-length-optimization
    run_name: default
  # Dataset parameters
  max_prompts: 1                  # Number of prompts to train on
  min_prompt_length: 30              # Minimum prompt length (characters)
  max_prompt_length: 150             # Maximum prompt length (characters)
  
  # Training parameters per prompt
  episodes_per_prompt: 5             # Episodes to train on each prompt (debug)
  steps_per_episode: 10            # Steps per episode (debug)
  init_len: 8                       # Initial prompt length in tokens (tight cap)
  
  # Optimization parameters
  lr_embeddings: 0.01
  lr_policy: 0.0003
  alpha: 1.0                         # Likelihood weight
  beta: 1.0                          # Length penalty (normalized by init_len)
  projection_weight: 0.1            # Weight for projection regularization (continuous_proj mode)
  distance_metric: l2                # Distance metric for projection: 'l2' or 'dot'
  
  # Parallel processing parameters
  batch_size: 1                      # Prompts per batch for progress tracking
  
  # Output
  save_path: models/trained_policy_complex.pt
  plots_prefix: training
  no_plots: false
  plots_format: pdf                  # png|pdf (default: pdf)

  optimization_mode: discrete
  gcg_top_k: 8
  gcg_batch_size: 4
  gcg_steps: 4
  # Set optimization_mode to 'ppo_parallel' to enable batched PPO policy training
  ppo:
    epochs: 1
    clip: 0.2
    gamma: 0.99
    gae_lambda: 0.95
    value_coef: 0.5
    entropy_coef: 0.01
  reward:
    mode: teacher_forced            # teacher_forced | generation | hybrid
    teacher_weight: 1.0
    generation_weight: 1.0
    generation:
      max_new_tokens: 64
      temperature: 0.8
      top_p: 0.9
      top_k: 0
      num_beams: 1
      match_mode: substring         # substring | prefix | exact | ratio
      do_sample: true

eval:
  # Test dataset parameters
  max_test_prompts: 200               # Number of test prompts
  min_prompt_length: 30              # Min test prompt length
  max_prompt_length: 150             # Max test prompt length
  
  # Evaluation parameters
  init_len: 32                       # Initial prompt length
  max_policy_steps: 150               # Max policy steps per prompt
  opt_steps: 15                      # Optimization steps (fewer for dataset eval)
  log_every_opt: 999                 # Reduce logging
  
  # Output
  results_file: results/eval_results.csv
  save_trace: true                  # Don't save individual traces
  trace_path: results/eval_trace.csv
  no_plots: false                     # Don't create individual plots
  plots_prefix: eval
  plots_format: pdf                  # png|pdf (for when plots are enabled)
  reward:
    mode: teacher_forced
    teacher_weight: 1.0
    generation_weight: 1.0
    generation:
      max_new_tokens: 64
      temperature: 0.8
      top_p: 0.9
      top_k: 0
      num_beams: 1
      match_mode: substring
      do_sample: true
