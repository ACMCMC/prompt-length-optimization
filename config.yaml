# Configuration for toxic-chat dataset training and evaluation
# model: EleutherAI/pythia-410m
model: EleutherAI/pythia-160m
seed: 2262

# Dataset split ratios (must sum to 1.0)
dataset:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

train:
  # Dataset parameters
  max_prompts: 128                      # Number of prompts to train on
  min_prompt_length: 25              # Minimum prompt length (characters)
  max_prompt_length: 75             # Maximum prompt length (characters)
  
  # Training parameters per prompt
  episodes_per_prompt: 8            # Episodes to train on each prompt
  steps_per_episode: 24            # Steps per episode (increased for better RL learning)
  init_len: 16                       # Initial prompt length in tokens (number of suffix positions with attention mask = 1 at start)
  max_suffix_len: 32                 # Maximum suffix length (fixed size for batched suffix embeddings)
  
  # Optimization parameters
  lr_embeddings: 0.01
  lr_policy: 0.0003
  epsilon: 0.3                    # Epsilon for epsilon-greedy exploration (lower = less random exploration)
  epsilon_decay: 0.95            # Epsilon decay per episode (slightly slower decay, but from a lower starting epsilon)
  epsilon_min: 0.05               # Minimum epsilon value (higher = maintains more exploration)
  entropy_coef: 0.02              # Entropy bonus coefficient (encourages diverse action distributions; mostly unused if grpo.entropy_coef is set)
  temperature: 1.5                # Softmax temperature (higher = more exploration in policy)
  alpha: 1.0                         # Likelihood weight
  beta: 2.0                          # Length penalty (logarithmic: log(1+length), higher = more compression)
  projection_weight: 0.1            # Weight for projection regularization (continuous_proj mode)
  distance_metric: l2                # Distance metric for projection: 'l2' or 'dot'
  
  # Parallel processing parameters
  batch_size: 6                      # Prompts per batch for progress tracking
  rollouts_per_prompt: 4              # Number of trajectories (rollouts) per prompt for GRPO
  
  # Output
  save_path: models/trained_policy_complex.pt
  plots_prefix: training
  no_plots: false
  plots_format: pdf                  # png|pdf (default: pdf)

  # Wandb logging
  use_wandb: true                    # Enable wandb logging (default: true)
  wandb_project: prompt-optimization  # Wandb project name

  optimization_mode: discrete
  
  # GCG (Greedy Coordinate Gradient) parameters for discrete optimization
  gcg:
    top_k: 32
    batch_size: 32 # Number of candidates per position
    max_batch_size: 128  # Maximum batch size for forward passes (to avoid OOM), this modifies the above batch size to limit the number of elements per forward pass
    steps: 10
  
  # GRPO parameters (Group Relative Policy Optimization)
  grpo:
    epochs: 4                      # Number of GRPO update epochs per episode
    clip: 0.2                       # GRPO clipping epsilon
    gamma: 0.99                     # Discount factor
    entropy_coef: 0.003             # Entropy bonus coefficient (smaller = less pull toward uniform policy)
    max_grad_norm: 0.5              # Maximum gradient norm for clipping
  
  # Policy network architecture
  policy:
    hidden_size: 128                 # Hidden layer size for policy network

eval:
  # Test dataset parameters
  max_test_prompts: 200               # Number of test prompts
  min_prompt_length: 30              # Min test prompt length
  max_prompt_length: 150             # Max test prompt length
  
  # Evaluation parameters
  init_len: 16                       # Initial prompt length (number of suffix positions with attention mask = 1 at start)
  max_suffix_len: 32                 # Maximum suffix length (fixed size for batched suffix embeddings)
  max_policy_steps: 12               # Max policy steps per prompt
  opt_steps: 12                      # Optimization steps (fewer for dataset eval)
  log_every_opt: 1                 # Reduce logging
  
  # Output
  results_file: results/eval_results.csv
  save_trace: true                  # Don't save individual traces
  trace_path: results/eval_trace.csv
  no_plots: false                     # Don't create individual plots
  plots_prefix: eval
  plots_format: pdf                  # png|pdf (for when plots are enabled)
  batch_size: 16                    # Batch size for evaluation
  dataset: toxicchat                # Dataset to use during evaluation
