# Configuration for toxic-chat dataset training and evaluation
model: EleutherAI/pythia-70m
seed: 2262

# Dataset split ratios (must sum to 1.0)
dataset:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

train:
  # Dataset parameters
  max_prompts: 600                   # Number of prompts to train on
  min_prompt_length: 30              # Minimum prompt length (characters)
  max_prompt_length: 150             # Maximum prompt length (characters)
  
  # Training parameters per prompt
  episodes_per_prompt: 3             # Episodes to train on each prompt
  steps_per_episode: 25            # Steps per episode (increased for better RL learning)
  init_len: 16                       # Initial prompt length in tokens (number of suffix positions with attention mask = 1 at start)
  max_suffix_len: 32                 # Maximum suffix length (fixed size for batched suffix embeddings)
  
  # Optimization parameters
  lr_embeddings: 0.01
  lr_policy: 0.0003
  epsilon: 0.5                    # Epsilon for epsilon-greedy exploration (higher = more random exploration)
  epsilon_decay: 0.95            # Epsilon decay per episode (higher = slower decay, more exploration)
  epsilon_min: 0.05               # Minimum epsilon value (higher = maintains more exploration)
  entropy_coef: 0.05              # Entropy bonus coefficient (encourages diverse action distributions)
  temperature: 1.5                # Softmax temperature (higher = more exploration in policy)
  alpha: 0.5                         # Likelihood weight
  beta: 0.5                          # Length penalty (logarithmic: log(1+length), higher = more compression)
  projection_weight: 0.5            # Weight for projection regularization (continuous_proj mode)
  distance_metric: l2                # Distance metric for projection: 'l2' or 'dot'
  
  # Parallel processing parameters
  batch_size: 16                      # Prompts per batch for progress tracking
  rollouts_per_prompt: 4              # Number of trajectories (rollouts) per prompt for PPO advantage computation
  
  # Output
  save_path: models/trained_policy_complex.pt
  plots_prefix: training
  no_plots: false
  plots_format: pdf                  # png|pdf (default: pdf)

  # Wandb logging
  use_wandb: true                    # Enable wandb logging (default: true)
  wandb_project: prompt-optimization  # Wandb project name

  optimization_mode: discrete
  
  # GCG (Greedy Coordinate Gradient) parameters for discrete optimization
  gcg:
    top_k: 32
    batch_size: 32  # Number of candidates per position
    max_batch_size: 256  # Maximum batch size for forward passes (to avoid OOM)
    steps: 5
  
  # GRPO parameters (Group Relative Policy Optimization)
  grpo:
    epochs: 4                      # Number of GRPO update epochs per episode
    clip: 0.2                       # GRPO clipping epsilon
    gamma: 0.99                     # Discount factor
    gae_lambda: 0.95                # GAE lambda parameter
    value_coef: 0.5                 # Value loss coefficient
    entropy_coef: 0.01              # Entropy bonus coefficient (overrides train.entropy_coef if set)
    max_grad_norm: 0.5              # Maximum gradient norm for clipping
  
  # Policy network architecture
  policy:
    hidden_size: 64                 # Hidden layer size for policy and value networks
    value_init_bias: -1000.0        # Initial bias for value network output layer
    value_init_gain: 0.1            # Initial weight gain for value network output layer

eval:
  # Test dataset parameters
  max_test_prompts: 200               # Number of test prompts
  min_prompt_length: 30              # Min test prompt length
  max_prompt_length: 150             # Max test prompt length
  
  # Evaluation parameters
  init_len: 32                       # Initial prompt length (number of suffix positions with attention mask = 1 at start)
  max_suffix_len: 64                 # Maximum suffix length (fixed size for batched suffix embeddings)
  max_policy_steps: 150               # Max policy steps per prompt
  opt_steps: 15                      # Optimization steps (fewer for dataset eval)
  log_every_opt: 1                 # Reduce logging
  
  # Output
  results_file: results/eval_results.csv
  save_trace: true                  # Don't save individual traces
  trace_path: results/eval_trace.csv
  no_plots: false                     # Don't create individual plots
  plots_prefix: eval
  plots_format: pdf                  # png|pdf (for when plots are enabled)
